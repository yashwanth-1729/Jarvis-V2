[package]
name = "app"
version = "3.0.0"
description = "JARVIS 3 native application shell"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[features]
# Tauri decides devUrl vs frontendDist at compile time via this exact feature
# name (tauri-build's build.rs: `dev = !custom_protocol`) -- NOT via cargo's
# debug/release profile, which is not the same thing. `tauri build` (i.e.
# `npm run desktop:build`) passes --features custom-protocol automatically;
# `tauri dev` does not. A bare `cargo build --release` gets NEITHER unless
# you pass `--features tauri/custom-protocol` explicitly -- without it, the
# binary is `--release` in every profiling sense but still tries to load
# devUrl (http://localhost:3000) and fails with "can't reach this page" the
# instant no dev server is running, which looks exactly like a backend
# problem but is not one. Deliberately NOT `default = [...]` here, matching
# upstream's own template: making it a default would also turn it on for
# `tauri dev`, which needs devUrl for hot reload. Always build a real
# production binary via `npm run desktop:build`, not bare cargo.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

# Desktop only: the taskbar icon must raise the window JARVIS already
# has rather than start a second one fighting for port 8000.
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = "2"
